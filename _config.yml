related_posts: 3
title: extremefuni.it
baseurl: ""
url: "https://extremefuni.it"
email: ""
description: "extremefuni.it: lavori in quota su fune a Roma e nel Lazio. Grondaie, canne fumarie, facciate, tetti e messa in sicurezza senza ponteggi. Sopralluogo gratuito."
footer_text: "&copy; 2026 extremefuni.it"
minimal_mistakes_skin: default
search: true

# SEO globale
author:
  name: "Andrew"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Andrew, fondatore di extremefuni.it. Lavori edili in quota su fune, senza ponteggi. Scrivimi per un sopralluogo gratuito."
  links:
    - label: "Richiedi un preventivo"
      icon: "fas fa-fw fa-envelope"
      url: "/contatti/"

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
exclude:
  - vendor
  - docs

permalink: /:categories/:title/

timezone:

collections:
  products:
    output: true
    permalink: /shop/:name/
  servizi:
    output: true
    permalink: /servizi/:name/
  progetti:
    output: true
    permalink: /progetti/:name/

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links: []

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: products
    values:
      layout: product
      classes: wide
  - scope:
      path: ""
      type: servizi
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: progetti
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

cms_homepage: 
